<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktiv Annons</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body id="page-body">
<!-- Lägg denna överst i din quiz-vy eller direkt efter <body> -->
<img id="bg-image" src="" alt="" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;" />
  <div class="ad-container">
    <!-- Fråge-vy (de 4 klickbara svarsbilderna) -->
    <div id="quiz-view">
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- Slut-vy (dold från början, visas när hela bg4 är klickbar) -->
    <div id="result-view" class="hidden">
      <!-- Knappen för att starta om (valfri) -->
      <button class="restart-btn" id="restart-btn" onclick="restartQuiz(event)">Prova igen</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
